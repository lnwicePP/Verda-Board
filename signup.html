<script>
  firebase.auth().onAuthStateChanged((user) => {
    if (user) {
      console.log('✓ User already logged in, redirecting to home...');
      window.location.href = 'home.html';
    }
  });

  function togglePw() {
    const pw = document.getElementById('pw');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  }

  function updateStrength() {
    const pw = document.getElementById('pw').value;
    const meter = document.getElementById('strength');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (pw.length >= 8) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/\d/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    if (pw.length === 0) score = 0;

    meter.className = 'strength' + (score ? ' s' + score : '');
    label.className = 'strength-label' + (score ? ' s' + score : '');
    const texts = ['ความปลอดภัยของรหัส', 'อ่อน · ต้องปรับปรุง', 'พอใช้', 'ดี', 'ปลอดภัยมาก ✓'];
    label.textContent = texts[score];
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const displayName = form.querySelector('input[type="text"]').value;
    const email = form.querySelector('input[type="email"]').value;
    const password = form.querySelector('input[type="password"]').value;
    const role = form.querySelector('input[name="role"]:checked').value;
    const termsCheckbox = form.querySelector('input[type="checkbox"]');
    const btn = form.querySelector('.submit');
    const orig = btn.innerHTML;

    if (!termsCheckbox.checked) {
      showError(form, 'กรุณายอมรับเงื่อนไขการใช้งาน');
      return;
    }

    if (password.length < 8) {
      showError(form, 'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
      return;
    }

    btn.innerHTML = 'กำลังสร้างบัญชี...';
    btn.disabled = true;
    btn.style.pointerEvents = 'none';
    btn.style.opacity = '0.6';

    try {
      console.log('Starting signup...');
      const result = await signUp(email, password, displayName, role);
      console.log('Signup result:', result);

      if (result.success) {
        console.log('✓ Signup success, about to redirect to home.html');
        btn.innerHTML = '✓ สร้างบัญชีสำเร็จ';
        window.location.href = 'home.html';
      } else {
        btn.style.pointerEvents = 'auto';
        btn.style.opacity = '1';
        btn.innerHTML = orig;
        btn.disabled = false;
        showError(form, result.error);
        console.error('Signup failed:', result.error);
      }
    } catch (err) {
      btn.style.pointerEvents = 'auto';
      btn.style.opacity = '1';
      btn.innerHTML = orig;
      btn.disabled = false;
      showError(form, 'เกิดข้อผิดพลาด: ' + err.message);
      console.error('Signup error:', err);
    }
  }

  function showError(form, message) {
    let errorDiv = form.querySelector('.error-msg');
    if (!errorDiv) {
      errorDiv = document.createElement('div');
      errorDiv.className = 'error-msg';
      form.insertBefore(errorDiv, form.firstChild);
    }
    errorDiv.textContent = message;
  }

  async function googleSignInSignup() {
    const btn = event.target.closest('button');
    btn.disabled = true;
    btn.style.pointerEvents = 'none';
    btn.style.opacity = '0.6';
    const orig = btn.innerHTML;
    btn.innerHTML = 'กำลังสมัครสมาชิก...';

    const result = await googleSignIn();

    if (result.success) {
      btn.innerHTML = '✓ สมัครสำเร็จ';
      console.log('✓ Firestore save complete, redirecting to home...');
      window.location.href = 'home.html';
    } else {
      btn.innerHTML = orig;
      btn.disabled = false;
      btn.style.pointerEvents = 'auto';
      btn.style.opacity = '1';
      alert('สมัครสมาชิกไม่สำเร็จ: ' + result.error);
    }
  }

  window.togglePw = togglePw;
  window.updateStrength = updateStrength;
  window.handleSubmit = handleSubmit;
  window.googleSignInSignup = googleSignInSignup;
</script>
