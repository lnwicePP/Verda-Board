<script>
  // firebase.auth().onAuthStateChanged((user) => {
  //   if (user) {
  //     window.location.href = 'home.html';
  //   }
  // });

  function togglePw() {
    const pw = document.getElementById('pw');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const email = form.querySelector('input[type="email"]').value;
    const password = form.querySelector('input[type="password"]').value;
    const btn = form.querySelector('.submit');
    const orig = btn.innerHTML;

    btn.innerHTML = 'กำลังเข้าสู่ระบบ...';
    btn.disabled = true;

    const result = await login(email, password);

    if (result.success) {
      btn.innerHTML = '✓ สำเร็จ';
      window.location.href = 'home.html';
    } else {
      btn.innerHTML = orig;
      btn.disabled = false;
      showError(form, result.error);
    }
  }

  function showError(form, message) {
    let errorDiv = form.querySelector('.error-msg');
    if (!errorDiv) {
      errorDiv = document.createElement('div');
      errorDiv.className = 'error-msg';
      form.insertBefore(errorDiv, form.firstChild);
    }
    errorDiv.textContent = message;
  }

  async function googleSignInLogin() {
    const btn = event.target.closest('button');
    btn.disabled = true;
    const orig = btn.innerHTML;
    btn.innerHTML = 'กำลังเข้าสู่ระบบ...';

    const result = await googleSignIn();

    if (result.success) {
      btn.innerHTML = '✓ เข้าสู่ระบบสำเร็จ';
      console.log('✓ Firestore save complete, redirecting to home...');
      window.location.href = 'home.html';
    } else {
      btn.innerHTML = orig;
      btn.disabled = false;
      alert('เข้าสู่ระบบไม่สำเร็จ: ' + result.error);
    }
  }

  window.togglePw = togglePw;
  window.handleSubmit = handleSubmit;
  window.googleSignInLogin = googleSignInLogin;
</script>
